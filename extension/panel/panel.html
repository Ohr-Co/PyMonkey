<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PyMonkey</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <h1>PyMonkey</h1>
      <span id="status" class="status">Loading Python…</span>
    </header>

    <div class="row">
      <select id="script-list" aria-label="Saved scripts"></select>
      <button id="new">New</button>
    </div>

    <!-- Scripts as .py files. The file input is the browser's "choose a file"
         dialog; it is hidden, and the Import button opens it. -->
    <div class="row">
      <button id="import">Import…</button>
      <button id="export">Export</button>
      <input id="import-file" type="file" accept=".py,text/x-python,text/plain" multiple hidden />
    </div>

    <!-- The selected script's last automatic run. Hidden until it has one. -->
    <details id="last-run" hidden>
      <summary id="last-run-summary"></summary>
      <p id="last-run-url"></p>
      <pre id="last-run-output"></pre>
    </details>

    <label>Name <input id="name" type="text" placeholder="My script" /></label>

    <label>
      Run automatically on
      <input id="match" type="text" placeholder="https://example.com/*   (blank = manual only)" />
    </label>

    <label class="check"><input id="enabled" type="checkbox" checked /> Enabled</label>

    <label>
      Time limit in seconds (0 = no limit)
      <input id="timeout" type="number" min="0" step="1" value="30" />
    </label>

    <!-- The code editor (CodeMirror) is created inside this element: see editor.js. -->
    <div id="code"></div>

    <div class="row">
      <button id="run" class="primary">Run on this page</button>
      <button id="stop" class="primary" hidden>Stop</button>
      <button id="save">Save</button>
      <button id="delete">Delete</button>
    </div>

    <pre id="output" aria-live="polite"></pre>

    <script type="module" src="panel.js"></script>
  </body>
</html>
